        totalElements:
          type: integer
          minimum: 0
          description: Число уведомлений текущего пользователя с учётом фильтров
        totalPages:
          type: integer
          minimum: 0
          description: Число страниц; 0, если элементов нет
    WatchlistPage:
      type: object
