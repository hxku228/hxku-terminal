asyncapi: 3.0.0
info:
  title: Notification Service Kafka API
  version: 1.0.0
  description: Входящее событие и задания доставки сохраняются до подтверждения Kafka; уникальна комбинация sourceEventId + userId + channel.
    Перед отправкой проверяются привязка и настройки. Временные ошибки повторяются с паузой; 429 учитывает retry_after; постоянные ошибки или
    исчерпание лимита дают FAILED. При отключении отправки — SKIPPED. SENT и notification.sent в outbox сохраняются одной транзакцией. Таймаут
    Telegram может означать неизвестный результат; повтор способен дать дубликат, гарантия exactly-once не заявляется.
defaultContentType: application/json
servers:
  local:
    host: localhost:9092
    protocol: kafka
    description: Локальный брокер; адрес меняется при развёртывании
channels:
  trade.executed:
    address: trade.executed
    description: 'Отправитель: trading-service. Получатели: tracking-service, portfolio-service, notification-service. Учитывать сделку один раз
      по orderId; eventId защищает от повторной доставки. Публиковать сделки кошелька и токена в порядке исполнения. Получатель определяется из
      payload.userId.'
    servers:
      - $ref: '#/servers/local'
    messages:
      TradeExecutedMessage:
        $ref: '#/components/messages/TradeExecutedMessage'
  trade.rejected:
    address: trade.rejected
    description: 'Отправитель: trading-service. Получатели: tracking-service, notification-service. Получатель определяется из payload.userId.'
    servers:
      - $ref: '#/servers/local'
    messages:
      TradeRejectedMessage:
        $ref: '#/components/messages/TradeRejectedMessage'
  trade.failed:
    address: trade.failed
    description: 'Отправитель: trading-service. Получатели: tracking-service, portfolio-service, notification-service. Учитывать фактические расходы
      один раз по orderId и signature; нулевая комиссия не создаёт расход. Получатель определяется из payload.userId.'
    servers:
      - $ref: '#/servers/local'
    messages:
      TradeFailedMessage:
        $ref: '#/components/messages/TradeFailedMessage'
  tracking.wallet.activity.detected:
    address: tracking.wallet.activity.detected
    description: 'Отправитель: tracking-service. Получатели: notification-service. Получатель определяется из payload.userId.'
    servers:
      - $ref: '#/servers/local'
    messages:
      WalletActivityDetectedMessage:
        $ref: '#/components/messages/WalletActivityDetectedMessage'
  analysis.rug.detected:
    address: analysis.rug.detected
    description: 'Отправитель: analyzer-service. Получатели: notification-service. Получатели выбираются по watchlist mint; не выполняется рассылка
      всем пользователям.'
    servers:
      - $ref: '#/servers/local'
    messages:
      RugDetectedMessage:
        $ref: '#/components/messages/RugDetectedMessage'
  notification.sent:
    address: notification.sent
    description: 'Отправитель: notification-service. Событие аудита отправки; обязательных подписчиков в текущем проекте нет.'
    servers:
      - $ref: '#/servers/local'
    messages:
      NotificationSentMessage:
        $ref: '#/components/messages/NotificationSentMessage'
operations:
  receiveTradeExecuted:
    action: receive
    channel:
      $ref: '#/channels/trade.executed'
    messages:
      - $ref: '#/channels/trade.executed/messages/TradeExecutedMessage'
    bindings:
      kafka:
        groupId:
          type: string
          enum:
            - notification-service
        bindingVersion: 0.5.0
  receiveTradeRejected:
    action: receive
    channel:
      $ref: '#/channels/trade.rejected'
    messages:
      - $ref: '#/channels/trade.rejected/messages/TradeRejectedMessage'
    bindings:
      kafka:
        groupId:
          type: string
          enum:
            - notification-service
        bindingVersion: 0.5.0
  receiveTradeFailed:
    action: receive
    channel:
      $ref: '#/channels/trade.failed'
    messages:
      - $ref: '#/channels/trade.failed/messages/TradeFailedMessage'
    bindings:
      kafka:
        groupId:
          type: string
          enum:
            - notification-service
        bindingVersion: 0.5.0
  receiveWalletActivityDetected:
    action: receive
    channel:
      $ref: '#/channels/tracking.wallet.activity.detected'
    messages:
      - $ref: '#/channels/tracking.wallet.activity.detected/messages/WalletActivityDetectedMessage'
    bindings:
      kafka:
        groupId:
          type: string
          enum:
            - notification-service
        bindingVersion: 0.5.0
  receiveRugDetected:
    action: receive
    channel:
      $ref: '#/channels/analysis.rug.detected'
    messages:
      - $ref: '#/channels/analysis.rug.detected/messages/RugDetectedMessage'
    bindings:
      kafka:
        groupId:
          type: string
          enum:
            - notification-service
        bindingVersion: 0.5.0
  sendNotificationSent:
    action: send
    channel:
      $ref: '#/channels/notification.sent'
    messages:
      - $ref: '#/channels/notification.sent/messages/NotificationSentMessage'
components:
  messages:
    TradeExecutedMessage:
      name: TradeExecuted
      title: trade.executed
      contentType: application/json
      correlationId:
        location: $message.payload#/correlationId
      payload:
        $ref: '#/components/schemas/TradeExecuted'
      bindings:
        kafka:
          key:
            type: string
            description: Строка payload.tradingWalletId + ":" + payload.mint
          bindingVersion: 0.5.0
      examples:
        - name: example1
          payload:
            eventId: 11111111-1111-4111-8111-000000000008
            eventType: trade.executed
            schemaVersion: 1
            occurredAt: '2026-11-11T12:00:00Z'
            correlationId: 11111111-1111-4111-8111-000000000009
            payload:
              intentId: 11111111-1111-4111-8111-000000000007
              orderId: 11111111-1111-4111-8111-000000000020
              userId: 11111111-1111-4111-8111-000000000010
              copySettingsId: 11111111-1111-4111-8111-000000000003
              tradingWalletId: 11111111-1111-4111-8111-000000000002
              mint: BSBkEGZfkitKTHVaC8VvCJ37Fj5r7XjssBeesic6mjwZ
              side: BUY
              positionId: null
              quantityRaw: '100000000'
              tokenDecimals: 6
              amountSol: 0.1
              executionPriceUsd: 0.15
              signature: '3333333333333333333333333333333333333333333333333333333333333333333333333333333333333333'
              networkFeeLamports: 105000
              tipLamports: 100000
              solPriceUsd: 150
              executedAt: '2026-11-11T12:00:00Z'
              amountUsd: 15
        - name: example2
          payload:
            eventId: 11111111-1111-4111-8111-000000000028
            eventType: trade.executed
            schemaVersion: 1
            occurredAt: '2026-11-11T12:05:00Z'
            correlationId: 11111111-1111-4111-8111-000000000009
