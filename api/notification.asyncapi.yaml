              userId: 11111111-1111-4111-8111-000000000010
              copySettingsId: 11111111-1111-4111-8111-000000000003
              tradingWalletId: 11111111-1111-4111-8111-000000000002
              mint: BSBkEGZfkitKTHVaC8VvCJ37Fj5r7XjssBeesic6mjwZ
              side: SELL
              positionId: 11111111-1111-4111-8111-000000000006
              quantityRaw: '50000000'
              tokenDecimals: 6
              amountSol: 0.06
              executionPriceUsd: 0.18
              signature: '3333333333333333333333333333333333333333333333333333333333333333333333333333333333333333'
              networkFeeLamports: 105000
              tipLamports: 100000
              solPriceUsd: 150
              executedAt: '2026-11-11T12:05:00Z'
              amountUsd: 9
    TradeRejectedMessage:
      name: TradeRejected
      title: trade.rejected
      contentType: application/json
      correlationId:
        location: $message.payload#/correlationId
      payload:
        $ref: '#/components/schemas/TradeRejected'
      bindings:
        kafka:
          key:
            type: string
            description: Строка payload.tradingWalletId + ":" + payload.mint
