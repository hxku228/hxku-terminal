    TradeFailedMessage:
      name: TradeFailed
      title: trade.failed
      contentType: application/json
      correlationId:
        location: $message.payload#/correlationId
      payload:
        $ref: '#/components/schemas/TradeFailed'
      bindings:
        kafka:
          key:
            type: string
            description: Строка payload.tradingWalletId + ":" + payload.mint
          bindingVersion: 0.5.0
      examples:
        - name: example1
          payload:
            eventId: 11111111-1111-4111-8111-000000000008
            eventType: trade.failed
            schemaVersion: 1
            occurredAt: '2026-11-11T12:00:00Z'
            correlationId: 11111111-1111-4111-8111-000000000009
            payload:
              intentId: 11111111-1111-4111-8111-000000000007
              orderId: 11111111-1111-4111-8111-000000000020
              userId: 11111111-1111-4111-8111-000000000010
              copySettingsId: 11111111-1111-4111-8111-000000000003
              tradingWalletId: 11111111-1111-4111-8111-000000000002
              mint: BSBkEGZfkitKTHVaC8VvCJ37Fj5r7XjssBeesic6mjwZ
              side: BUY
              positionId: null
              reason: TRANSACTION_CONFIRMED_FAILED
              networkFeeLamports: 105000
              tipLamports: 0
              solPriceUsd: 150
              executedAt: '2026-11-11T12:00:00Z'
              signature: '3333333333333333333333333333333333333333333333333333333333333333333333333333333333333333'
        - name: example2
          payload:
            eventId: 11111111-1111-4111-8111-000000000018
            eventType: trade.failed
            schemaVersion: 1
            occurredAt: '2026-11-11T12:00:00Z'
            correlationId: 11111111-1111-4111-8111-000000000009
            payload:
              intentId: 11111111-1111-4111-8111-000000000007
              orderId: 11111111-1111-4111-8111-000000000020
              userId: 11111111-1111-4111-8111-000000000010
              copySettingsId: 11111111-1111-4111-8111-000000000003
              tradingWalletId: 11111111-1111-4111-8111-000000000002
              mint: BSBkEGZfkitKTHVaC8VvCJ37Fj5r7XjssBeesic6mjwZ
              side: BUY
              positionId: null
              reason: TRANSACTION_EXPIRED
              networkFeeLamports: 0
              tipLamports: 0
              solPriceUsd: null
              executedAt: null
              signature: '3333333333333333333333333333333333333333333333333333333333333333333333333333333333333333'
    WalletActivityDetectedMessage:
      name: WalletActivityDetected
      title: tracking.wallet.activity.detected
      contentType: application/json
      correlationId:
        location: $message.payload#/correlationId
      payload:
        $ref: '#/components/schemas/WalletActivityDetected'
      bindings:
        kafka:
          key:
            type: string
            description: Значение payload.userId
          bindingVersion: 0.5.0
      examples:
        - name: example1
          payload:
            eventId: 11111111-1111-4111-8111-000000000008
            eventType: tracking.wallet.activity.detected
            schemaVersion: 1
            occurredAt: '2026-11-11T12:00:00Z'
            correlationId: 11111111-1111-4111-8111-000000000009
            payload:
              userId: 11111111-1111-4111-8111-000000000010
              activity:
                id: 11111111-1111-4111-8111-000000000005
                trackedWalletId: 11111111-1111-4111-8111-000000000001
                walletAddress: 9AuDJoa2bDgcN2fisM9nBWdunvdNiyDiZo2dFCkArq2T
                signature: '3333333333333333333333333333333333333333333333333333333333333333333333333333333333333333'
                instructionIndex: 2
                type: BUY
                mint: BSBkEGZfkitKTHVaC8VvCJ37Fj5r7XjssBeesic6mjwZ
                tokenAmountRaw: '100000000'
                tokenDecimals: 6
                occurredAt: '2026-11-11T12:00:00Z'
    RugDetectedMessage:
      name: RugDetected
      title: analysis.rug.detected
      contentType: application/json
      correlationId:
        location: $message.payload#/correlationId
      payload:
        $ref: '#/components/schemas/RugDetected'
      bindings:
        kafka:
          key:
            type: string
            description: Значение payload.mint
          bindingVersion: 0.5.0
      examples:
        - name: example1
          payload:
            eventId: 11111111-1111-4111-8111-000000000008
            eventType: analysis.rug.detected
            schemaVersion: 1
            occurredAt: '2026-11-11T12:00:00Z'
            correlationId: 11111111-1111-4111-8111-000000000009
            payload:
              mint: BSBkEGZfkitKTHVaC8VvCJ37Fj5r7XjssBeesic6mjwZ
              riskScore: 85
              riskFlags:
                - FREEZE_AUTHORITY_ENABLED
    NotificationSentMessage:
      name: NotificationSent
      title: notification.sent
      contentType: application/json
      correlationId:
        location: $message.payload#/correlationId
      payload:
        $ref: '#/components/schemas/NotificationSent'
      bindings:
        kafka:
          key:
            type: string
            description: Значение payload.userId
          bindingVersion: 0.5.0
      examples:
        - name: sent
          payload:
            eventId: 11111111-1111-4111-8111-000000000041
            eventType: notification.sent
            schemaVersion: 1
            occurredAt: '2026-11-19T12:00:00Z'
            correlationId: 11111111-1111-4111-8111-000000000009
            payload:
              notificationId: 11111111-1111-4111-8111-000000000040
              userId: 11111111-1111-4111-8111-000000000010
              sourceEventId: 11111111-1111-4111-8111-000000000008
              channel: TELEGRAM
              telegramMessageId: 42
              sentAt: '2026-11-19T12:00:00Z'
  schemas:
    TradeExecuted:
      type: object
      required:
        - eventId
        - eventType
        - schemaVersion
        - occurredAt
        - correlationId
        - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          const: trade.executed
        schemaVersion:
          type: integer
          const: 1
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid
        payload:
          type: object
          required:
            - intentId
            - orderId
            - userId
            - copySettingsId
            - tradingWalletId
            - mint
            - side
            - positionId
            - quantityRaw
            - tokenDecimals
            - amountSol
            - executionPriceUsd
            - signature
            - networkFeeLamports
            - tipLamports
            - solPriceUsd
            - executedAt
            - amountUsd
          properties:
            intentId:
              type: string
              format: uuid
            orderId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            copySettingsId:
              type:
                - string
                - 'null'
              format: uuid
              description: null для ручных сделок; tracking обрабатывает только свои автосделки
            tradingWalletId:
              type: string
              format: uuid
            mint:
              type: string
            side:
              type: string
              enum:
                - BUY
                - SELL
            positionId:
              type:
                - string
                - 'null'
              format: uuid
              description: Для ручной сделки или первой покупки может быть null; portfolio определяет позицию по кошельку и mint. Автопродажа
                передаёт positionId.
            quantityRaw:
              type: string
              pattern: ^[1-9][0-9]*$
              description: Фактическое количество полученных при BUY или отданных при SELL токенов в минимальных единицах
            tokenDecimals:
              type: integer
              minimum: 0
              maximum: 255
            amountSol:
              type: number
              minimum: 0
              description: Фактическая сумма SOL, отданная за токены при BUY или полученная при SELL; без сетевой комиссии, tip и затрат на создание
                аккаунтов
            executionPriceUsd:
              type:
                - number
                - 'null'
              exclusiveMinimum: 0
              description: Фактическая цена токена в USD на момент исполнения; null при неизвестной оценке
            signature:
              type: string
            networkFeeLamports:
              type: integer
              minimum: 0
              description: Фактически списанная сетевая комиссия, включая priority fee; 0, если списания не было
            tipLamports:
              type: integer
              minimum: 0
              description: Фактически выплаченный tip, отдельно от networkFeeLamports; 0, если не выплачен
            solPriceUsd:
              type:
                - number
                - 'null'
              format: double
              minimum: 0
              description: Цена SOL в USD на момент исполнения для оценки объёма и комиссий; null, если неизвестна
            executedAt:
              type: string
              format: date-time
              description: Время исполнения транзакции в блокчейне
            amountUsd:
              type:
                - number
                - 'null'
              format: double
              minimum: 0
              description: Фактический объём обмена в USD без сетевой комиссии и tip; null при неизвестной оценке
          allOf:
            - if:
                properties:
                  side:
                    const: SELL
                  copySettingsId:
                    type: string
                required:
                  - side
                  - copySettingsId
              then:
                additionalProperties: true
                properties:
                  positionId:
                    type: string
                    format: uuid
      description: Окончательно исполненная сделка. Portfolio учитывает её один раз по orderId, создаёт или изменяет позицию и сохраняет фактические
        комиссии.
    TradeRejected:
      type: object
      required:
        - eventId
        - eventType
        - schemaVersion
        - occurredAt
        - correlationId
        - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          const: trade.rejected
        schemaVersion:
          type: integer
          const: 1
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid
        payload:
          type: object
          required:
            - intentId
            - orderId
            - userId
            - copySettingsId
            - tradingWalletId
            - mint
            - side
            - positionId
            - reason
          properties:
            intentId:
              type: string
              format: uuid
            orderId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            copySettingsId:
              type:
                - string
                - 'null'
              format: uuid
              description: null для ручных сделок; tracking обрабатывает только свои автосделки
            tradingWalletId:
              type: string
              format: uuid
            mint:
              type: string
            side:
              type: string
              enum:
                - BUY
                - SELL
            positionId:
              type:
                - string
                - 'null'
              format: uuid
            reason:
              type: string
    TradeFailed:
      type: object
      required:
        - eventId
        - eventType
        - schemaVersion
        - occurredAt
        - correlationId
        - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          const: trade.failed
        schemaVersion:
          type: integer
          const: 1
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid
        payload:
          type: object
          required:
            - intentId
            - orderId
            - userId
            - copySettingsId
            - tradingWalletId
            - mint
            - side
            - positionId
            - reason
            - networkFeeLamports
            - tipLamports
            - solPriceUsd
            - executedAt
            - signature
          properties:
            intentId:
              type: string
              format: uuid
            orderId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            copySettingsId:
              type:
                - string
                - 'null'
              format: uuid
              description: null для ручных сделок; tracking обрабатывает только свои автосделки
            tradingWalletId:
              type: string
              format: uuid
            mint:
              type: string
            side:
              type: string
              enum:
                - BUY
                - SELL
            positionId:
              type:
                - string
                - 'null'
              format: uuid
              description: Для ручной сделки или первой покупки может быть null; portfolio определяет позицию по кошельку и mint. Автопродажа
                передаёт positionId.
            reason:
              type: string
              description: Причина окончательного отказа; неизвестный результат остаётся PENDING и сюда не попадает
            networkFeeLamports:
              type: integer
              minimum: 0
              description: Фактически списанная сетевая комиссия, включая priority fee; 0, если списания не было
            tipLamports:
              type: integer
              minimum: 0
              description: Фактически выплаченный tip, отдельно от networkFeeLamports; 0, если не выплачен
            solPriceUsd:
              type:
                - number
                - 'null'
              format: double
              minimum: 0
              description: Цена SOL в USD на момент исполнения для оценки объёма и комиссий; null, если неизвестна
            executedAt:
              type:
                - string
                - 'null'
              format: date-time
              description: Время исполнения транзакции в блокчейне; null, если транзакция не была включена
            signature:
              type:
                - string
                - 'null'
              description: Подпись транзакции; null, если транзакция не была подписана
          allOf:
            - if:
                properties:
                  side:
                    const: SELL
                  copySettingsId:
                    type: string
                required:
                  - side
                  - copySettingsId
              then:
                additionalProperties: true
                properties:
                  positionId:
                    type: string
                    format: uuid
      description: Окончательный отказ, не таймаут RPC. Portfolio учитывает фактически списанные комиссии как расход кошелька; не создаёт исполненную
        сделку или новую позицию.
    WalletActivityDetected:
      type: object
      required:
        - eventId
        - eventType
        - schemaVersion
        - occurredAt
        - correlationId
        - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          const: tracking.wallet.activity.detected
        schemaVersion:
          type: integer
          const: 1
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid
        payload:
          type: object
          required:
            - userId
            - activity
          properties:
            userId:
              type: string
              format: uuid
            activity:
              $ref: '#/components/schemas/WalletActivity'
      description: Сообщение Kafka; eventId уникален, correlationId связывает цепочку обработки
    WalletActivity:
      type: object
      required:
        - id
        - trackedWalletId
        - walletAddress
        - signature
        - instructionIndex
        - type
        - mint
        - tokenAmountRaw
        - tokenDecimals
        - occurredAt
      properties:
        id:
          type: string
          format: uuid
        trackedWalletId:
          type: string
          format: uuid
        walletAddress:
          type: string
        signature:
          type: string
          description: Подпись исходной транзакции
        instructionIndex:
          type: integer
          minimum: 0
          description: Индекс операции внутри транзакции
        type:
          type: string
          enum:
            - BUY
            - SELL
            - TRANSFER
        mint:
          type: string
        tokenAmountRaw:
          type: string
          pattern: ^[0-9]+$
        tokenDecimals:
          type: integer
          minimum: 0
          maximum: 255
        occurredAt:
          type: string
          format: date-time
    RugDetected:
      type: object
      required:
        - eventId
        - eventType
        - schemaVersion
        - occurredAt
        - correlationId
        - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          const: analysis.rug.detected
        schemaVersion:
          type: integer
          const: 1
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid
        payload:
          type: object
          required:
            - mint
            - riskScore
            - riskFlags
          properties:
            mint:
              type: string
            riskScore:
              type: number
              minimum: 0
              maximum: 100
            riskFlags:
              type: array
              items:
                type: string
    NotificationSent:
      type: object
      required:
        - eventId
        - eventType
        - schemaVersion
        - occurredAt
        - correlationId
        - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          const: notification.sent
        schemaVersion:
          type: integer
          const: 1
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid
        payload:
          type: object
          required:
            - notificationId
            - userId
            - sourceEventId
            - channel
            - telegramMessageId
            - sentAt
          properties:
            notificationId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            sourceEventId:
              type:
                - string
                - 'null'
              description: null для тестового уведомления
              format: uuid
            channel:
              type: string
              const: TELEGRAM
            telegramMessageId:
              type: integer
              minimum: 1
            sentAt:
              type: string
              format: date-time
      description: Telegram подтвердил приём сообщения. Это не подтверждение прочтения пользователем.
