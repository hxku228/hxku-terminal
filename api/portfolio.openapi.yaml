openapi: 3.1.1

info:
  title: Portfolio Service API
  version: 1.0.0

servers:
  - url: /

security:
  - bearerAuth: []

paths:
  /api/v1/portfolio:
    get:
      summary: Получить сводку портфеля и статистику за период
      operationId: getPortfolio
      parameters:
        - name: walletId
          in: query
          required: true
          description: Внутренний идентификатор собственного торгового кошелька, не адрес Solana
          schema:
            type: string
            format: uuid
          example: 11111111-1111-4111-8111-000000000002
        - name: period
          in: query
          required: false
          description: Последние 24 часа, 7 или 30 дней; ALL — вся учтённая история
          schema:
            type: string
            enum: [1D, 7D, 30D, ALL]
            default: 7D
          example: 7D
      responses:
        '200':
          description: Текущая сводка и статистика учтённых сделок за выбранный период
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'
              example:
                walletId: 11111111-1111-4111-8111-000000000002
                summary:
                  balanceSol: 1.5
                  portfolioValueUsd: 450
                  unrealizedPnlUsd: 25
                stats:
                  period: 7D
                  tradesCount: 12
                  tradingVolumeUsd: 800
                  realizedPnlUsd: 40
                  winRatePercent: 60
                updatedAt: '2026-11-12T12:00:00Z'
        '400':
          description: walletId отсутствует, имеет неверный формат или period недопустим
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: walletId должен быть UUID, а period — одним из 1D, 7D, 30D, ALL
        '401':
          description: Токен доступа отсутствует или недействителен
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Требуется действительный токен доступа
        '404':
          description: Кошелёк не найден или принадлежит другому пользователю
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: Кошелёк не найден
        '503':
          description: Сервис временно недоступен или учёт портфеля ещё не готов
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Service Unavailable
                status: 503
                detail: Данные портфеля временно недоступны

  /api/v1/positions:
    get:
      summary: Получить позиции своего торгового кошелька
      operationId: getPositions
      description: Учтённые позиции, сначала новые по openedAt, затем по id. После полного закрытия новая покупка токена создаёт позицию с новым id.
      parameters:
        - name: walletId
          in: query
          required: true
          description: Внутренний идентификатор собственного торгового кошелька
          schema:
            type: string
            format: uuid
          example: 11111111-1111-4111-8111-000000000002
        - name: status
          in: query
          description: Если не указан, возвращаются открытые и закрытые позиции
          schema:
            type: string
            enum: [OPEN, CLOSED]
          example: OPEN
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
      responses:
        '200':
          description: Страница позиций; если позиций нет, content пустой
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionPage'
              example:
                content:
                  - id: 11111111-1111-4111-8111-000000000006
                    mint: BSBkEGZfkitKTHVaC8VvCJ37Fj5r7XjssBeesic6mjwZ
                    symbol: EXAMPLE
                    tokenName: Example Token
                    boughtAmountUsd: 100
                    soldAmountUsd: 60
                    boughtQuantity: '1000'
                    soldQuantity: '500'
                    remainingQuantity: '500'
                    remainingValueUsd: 70
                    pnlUsd: 28
                    pnlPercent: 27.7227722772
                    status: OPEN
                    openedAt: '2026-11-11T12:00:00Z'
                    closedAt: null
                    updatedAt: '2026-11-19T12:00:00Z'
                page: 0
                size: 20
                totalElements: 1
                totalPages: 1
        '400':
          description: Некорректные параметры запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: Требуется walletId в формате UUID; status — OPEN или CLOSED, page >= 0, size от 1 до 100
        '401':
          description: Токен доступа отсутствует или недействителен
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Требуется действительный токен доступа
        '404':
          description: Кошелёк не найден или принадлежит другому пользователю
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: Кошелёк не найден
        '503':
          description: Сервис временно недоступен или учёт позиций ещё не готов
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Service Unavailable
                status: 503
                detail: Данные позиций временно недоступны

  /api/v1/trades:
    get:
      summary: Получить историю исполненных сделок своего кошелька
      operationId: getTrades
      description: Ручные и скопированные сделки, сначала новые по executedAt, затем по id. Ожидающие и неуспешные ордера сюда не входят.
      parameters:
        - name: walletId
          in: query
          required: true
          description: Внутренний идентификатор собственного торгового кошелька
          schema:
            type: string
            format: uuid
          example: 11111111-1111-4111-8111-000000000002
        - name: positionId
          in: query
          description: Ограничить историю одной позицией указанного кошелька
          schema:
            type: string
            format: uuid
          example: 11111111-1111-4111-8111-000000000006
        - name: side
          in: query
          description: Если не указана, возвращаются покупки и продажи
          schema:
            type: string
            enum: [BUY, SELL]
          example: BUY
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
      responses:
        '200':
          description: Страница сделок; если сделок нет, content пустой
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradePage'
              example:
                content:
                  - id: 11111111-1111-4111-8111-000000000008
                    orderId: 11111111-1111-4111-8111-000000000009
                    positionId: 11111111-1111-4111-8111-000000000006
                    walletId: 11111111-1111-4111-8111-000000000002
                    mint: BSBkEGZfkitKTHVaC8VvCJ37Fj5r7XjssBeesic6mjwZ
                    symbol: EXAMPLE
                    tokenName: Example Token
                    side: BUY
                    quantity: '1000'
                    amountUsd: 100
                    feesUsd: 1
                    signature: '5vExampleTransactionSignature'
                    executedAt: '2026-11-11T12:00:00Z'
                page: 0
                size: 20
                totalElements: 1
                totalPages: 1
        '400':
          description: Некорректные параметры запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: walletId и positionId должны быть UUID; side — BUY или SELL, page >= 0, size от 1 до 100
        '401':
          description: Токен доступа отсутствует или недействителен
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Требуется действительный токен доступа
        '404':
          description: Кошелёк недоступен пользователю или позиция не найдена в указанном кошельке
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: Кошелёк или позиция не найдены
        '503':
          description: Сервис временно недоступен или история сделок ещё не готова
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Service Unavailable
                status: 503
                detail: История сделок временно недоступна

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Portfolio:
      type: object
      required: [walletId, summary, stats, updatedAt]
      properties:
        walletId:
          type: string
          format: uuid
        summary:
          $ref: '#/components/schemas/PortfolioSummary'
        stats:
          $ref: '#/components/schemas/PortfolioStats'
        updatedAt:
          type: string
          format: date-time
          description: Время снимка данных; конец выбранного периода статистики

    PortfolioSummary:
      type: object
      required: [balanceSol, portfolioValueUsd, unrealizedPnlUsd]
      properties:
        balanceSol:
          type: [number, "null"]
          format: double
          minimum: 0
          description: Текущий баланс SOL; null, если неизвестен
        portfolioValueUsd:
          type: [number, "null"]
          format: double
          minimum: 0
          description: Текущая стоимость SOL и токенов в USD; null при неполной оценке
        unrealizedPnlUsd:
          type: [number, "null"]
          format: double
          description: Текущий PnL оставшихся токенов учтённых позиций; не зависит от period; null при нехватке данных

    PortfolioStats:
      type: object
      required: [period, tradesCount, tradingVolumeUsd, realizedPnlUsd, winRatePercent]
      properties:
        period:
          type: string
          enum: [1D, 7D, 30D, ALL]
          description: Период из запроса или 7D, если параметр не передан
        tradesCount:
          type: integer
          minimum: 0
          description: Число исполненных покупок и продаж за период; переводы и неудачные заявки не учитываются
        tradingVolumeUsd:
          type: [number, "null"]
          format: double
          minimum: 0
          description: Сумма объёмов покупок и продаж в USD по ценам исполнения; null, если оценка неполная
        realizedPnlUsd:
          type: [number, "null"]
          format: double
          description: PnL продаж за период с учётом себестоимости и относимых комиссий; null, если расчёт неполный
        winRatePercent:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
          description: Доля прибыльных среди всех полностью закрытых за период позиций; безубыточные входят в знаменатель; null, если закрытых нет

    PositionPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Position'
        page:
          type: integer
          minimum: 0
          description: Номер страницы, начиная с 0
        size:
          type: integer
          minimum: 1
          maximum: 100
          description: Запрошенный размер страницы; фактическое число элементов — длина content
        totalElements:
          type: integer
          minimum: 0
          description: Число позиций кошелька с учётом фильтра status
        totalPages:
          type: integer
          minimum: 0
          description: Число страниц; 0, если позиций нет

    Position:
      type: object
      description: Данные за всё время позиции; переводы и чужие сделки не учитываются. Покупки до полного закрытия относятся к этой же позиции.
      required: [id, mint, symbol, tokenName, boughtAmountUsd, soldAmountUsd, boughtQuantity, soldQuantity, remainingQuantity, remainingValueUsd, pnlUsd, pnlPercent, status, openedAt, closedAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор позиции в portfolio; используется также как positionId в tracking
        mint:
          type: string
          description: Адрес токена в Solana
        symbol:
          type: [string, "null"]
          description: Тикер; null, если неизвестен
        tokenName:
          type: [string, "null"]
          description: Название токена; null, если неизвестно
        boughtAmountUsd:
          type: [number, "null"]
          format: double
          minimum: 0
          description: Сумма исполненных покупок в USD без сетевых комиссий и tip; null при неполной оценке
        soldAmountUsd:
          type: [number, "null"]
          format: double
          minimum: 0
          description: Сумма исполненных продаж в USD без вычета сетевых комиссий и tip; 0, если продаж нет; null при неполной оценке
        boughtQuantity:
          $ref: '#/components/schemas/TokenQuantity'
          description: Суммарное количество купленных токенов
        soldQuantity:
          $ref: '#/components/schemas/TokenQuantity'
          description: Суммарное количество проданных токенов
        remainingQuantity:
          $ref: '#/components/schemas/TokenQuantity'
          description: Остаток токенов; boughtQuantity минус soldQuantity; 0 для CLOSED
        remainingValueUsd:
          type: [number, "null"]
          format: double
          minimum: 0
          description: Рыночная стоимость остатка по последней доступной цене; 0 для CLOSED; null, если цена неизвестна
        pnlUsd:
          type: [number, "null"]
          format: double
          description: soldAmountUsd + remainingValueUsd - boughtAmountUsd - сетевые комиссии и tip сделок позиции в USD по времени исполнения; null при нехватке данных
        pnlPercent:
          type: [number, "null"]
          format: double
          description: pnlUsd / (boughtAmountUsd + сетевые комиссии и tip покупок в USD) * 100; null при нулевой базе или нехватке данных
        status:
          type: string
          enum: [OPEN, CLOSED]
          description: OPEN — есть остаток токенов; CLOSED — позиция полностью закрыта
        openedAt:
          type: string
          format: date-time
          description: Время первой исполненной покупки позиции
        closedAt:
          type: [string, "null"]
          format: date-time
          description: Время полного закрытия; null для OPEN
        updatedAt:
          type: string
          format: date-time
          description: Время последнего обновления данных позиции, включая оценку по цене

    TradePage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Trade'
        page:
          type: integer
          minimum: 0
          description: Номер страницы, начиная с 0
        size:
          type: integer
          minimum: 1
          maximum: 100
          description: Запрошенный размер страницы; фактическое число элементов — длина content
        totalElements:
          type: integer
          minimum: 0
          description: Число сделок кошелька с учётом фильтров
        totalPages:
          type: integer
          minimum: 0
          description: Число страниц; 0, если сделок нет

    Trade:
      type: object
      required: [id, orderId, positionId, walletId, mint, symbol, tokenName, side, quantity, amountUsd, feesUsd, signature, executedAt]
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор сделки в portfolio
        orderId:
          type: string
          format: uuid
          description: Идентификатор исполненного ордера в trading
        positionId:
          type: string
          format: uuid
        walletId:
          type: string
          format: uuid
        mint:
          type: string
          description: Адрес токена в Solana
        symbol:
          type: [string, "null"]
          description: Тикер; null, если неизвестен
        tokenName:
          type: [string, "null"]
          description: Название токена; null, если неизвестно
        side:
          type: string
          enum: [BUY, SELL]
        quantity:
          $ref: '#/components/schemas/TokenQuantity'
          description: Фактическое количество купленных или проданных токенов
        amountUsd:
          type: [number, "null"]
          format: double
          minimum: 0
          description: Фактический объём обмена в USD на момент исполнения без сетевой комиссии и tip; null при неизвестной оценке
        feesUsd:
          type: [number, "null"]
          format: double
          minimum: 0
          description: Фактическая сетевая комиссия, включая priority fee, плюс выплаченный tip в USD на момент исполнения; null при неизвестной оценке
        signature:
          type: string
          description: Подпись исполненной транзакции Solana
        executedAt:
          type: string
          format: date-time
          description: Время исполнения транзакции в блокчейне

    TokenQuantity:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
      description: Количество в токенах с учётом decimals, например '1.5'; строка сохраняет точность

    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string

