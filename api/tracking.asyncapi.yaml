              positionId: null
              reason: INSUFFICIENT_BALANCE
  schemas:
    PriceTick:
      type: object
      required:
        - eventId
        - eventType
        - schemaVersion
        - occurredAt
        - correlationId
        - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          const: md.price.tick
        schemaVersion:
          type: integer
          const: 1
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid
        payload:
          type: object
          required:
            - mint
            - priceUsd
            - observedAt
          properties:
            mint:
              type: string
            priceUsd:
              type: number
              exclusiveMinimum: 0
              description: Цена токена в USD
            observedAt:
              type: string
              format: date-time
    TradeExecuted:
      type: object
      required:
        - eventId
        - eventType
        - schemaVersion
        - occurredAt
        - correlationId
        - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          const: trade.executed
        schemaVersion:
          type: integer
          const: 1
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid
        payload:
          type: object
          required:
            - intentId
            - orderId
            - userId
            - copySettingsId
            - tradingWalletId
            - mint
            - side
            - positionId
            - quantityRaw
            - tokenDecimals
            - amountSol
            - executionPriceUsd
            - signature
            - networkFeeLamports
            - tipLamports
            - solPriceUsd
            - executedAt
            - amountUsd
          properties:
            intentId:
              type: string
              format: uuid
            orderId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            copySettingsId:
              type:
                - string
                - 'null'
              format: uuid
              description: null для ручных сделок; tracking обрабатывает только свои автосделки
            tradingWalletId:
              type: string
              format: uuid
            mint:
              type: string
            side:
              type: string
              enum:
                - BUY
                - SELL
            positionId:
              type:
                - string
                - 'null'
              format: uuid
