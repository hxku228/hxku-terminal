asyncapi: 3.0.0
info:
  title: Tracking Service Kafka API
  version: 1.0.0
  description: Контракт сообщений Kafka для tracking-service. eventId защищает от повторной обработки; correlationId связывает цепочку событий.
defaultContentType: application/json
servers:
  local:
    host: localhost:9092
    protocol: kafka
    description: Локальный брокер; адрес меняется при развёртывании
channels:
  md.price.tick:
    address: md.price.tick
    description: 'Отправитель: market-data-service. Получатели: tracking-service, portfolio-service. Использовать observedAt для защиты от устаревших
      цен.'
    servers:
      - $ref: '#/servers/local'
    messages:
      PriceTickMessage:
        $ref: '#/components/messages/PriceTickMessage'
  trade.executed:
    address: trade.executed
    description: 'Отправитель: trading-service. Получатели: tracking-service, portfolio-service, notification-service. Учитывать сделку один раз
      по orderId; eventId защищает от повторной доставки. Публиковать сделки кошелька и токена в порядке исполнения.'
    servers:
      - $ref: '#/servers/local'
    messages:
      TradeExecutedMessage:
        $ref: '#/components/messages/TradeExecutedMessage'
  trade.failed:
    address: trade.failed
    description: 'Отправитель: trading-service. Получатели: tracking-service, portfolio-service, notification-service. Учитывать фактические расходы
      один раз по orderId и signature; нулевая комиссия не создаёт расход.'
    servers:
      - $ref: '#/servers/local'
    messages:
      TradeFailedMessage:
        $ref: '#/components/messages/TradeFailedMessage'
  portfolio.position.opened:
    address: portfolio.position.opened
    description: 'Отправитель: portfolio-service. Получатели: tracking-service. Публикуется через outbox в одной транзакции с созданием позиции.'
    servers:
      - $ref: '#/servers/local'
    messages:
      PositionOpenedMessage:
        $ref: '#/components/messages/PositionOpenedMessage'
  portfolio.position.updated:
    address: portfolio.position.updated
    description: 'Отправитель: portfolio-service. Получатели: tracking-service. Публикуется через outbox после изменения количества; версия позиции
      увеличивается.'
    servers:
      - $ref: '#/servers/local'
    messages:
      PositionUpdatedMessage:
        $ref: '#/components/messages/PositionUpdatedMessage'
  portfolio.position.closed:
    address: portfolio.position.closed
    description: 'Отправитель: portfolio-service. Получатели: tracking-service. Публикуется через outbox при полном закрытии; версия позиции увеличивается.'
    servers:
      - $ref: '#/servers/local'
    messages:
      PositionClosedMessage:
        $ref: '#/components/messages/PositionClosedMessage'
  tracking.wallet.activity.detected:
    address: tracking.wallet.activity.detected
    description: 'Отправитель: tracking-service. Получатели: notification-service.'
    servers:
      - $ref: '#/servers/local'
    messages:
      WalletActivityDetectedMessage:
        $ref: '#/components/messages/WalletActivityDetectedMessage'
  tracking.copy.order.requested:
    address: tracking.copy.order.requested
    description: 'Отправитель: tracking-service. Получатели: trading-service. Trading проверяет владельца кошелька по userId и остаток средств; исполнение сериализуется по кошельку, повтор intentId не создаёт новый ордер.'
    servers:
      - $ref: '#/servers/local'
    messages:
      CopyOrderRequestedMessage:
        $ref: '#/components/messages/CopyOrderRequestedMessage'
  trade.rejected:
    address: trade.rejected
    description: 'Отправитель: trading-service. Получатели: tracking-service, notification-service.'
    servers:
      - $ref: '#/servers/local'
    messages:
      TradeRejectedMessage:
        $ref: '#/components/messages/TradeRejectedMessage'
operations:
  receivePriceTick:
    action: receive
    channel:
      $ref: '#/channels/md.price.tick'
    messages:
      - $ref: '#/channels/md.price.tick/messages/PriceTickMessage'
    bindings:
      kafka:
        groupId:
          type: string
          enum:
            - tracking-service
        bindingVersion: 0.5.0
  receiveTradeExecuted:
    action: receive
    channel:
      $ref: '#/channels/trade.executed'
    messages:
      - $ref: '#/channels/trade.executed/messages/TradeExecutedMessage'
    bindings:
      kafka:
        groupId:
          type: string
          enum:
            - tracking-service
        bindingVersion: 0.5.0
  receiveTradeFailed:
    action: receive
    channel:
      $ref: '#/channels/trade.failed'
    messages:
      - $ref: '#/channels/trade.failed/messages/TradeFailedMessage'
    bindings:
      kafka:
        groupId:
          type: string
          enum:
            - tracking-service
        bindingVersion: 0.5.0
  receivePositionOpened:
    action: receive
    channel:
      $ref: '#/channels/portfolio.position.opened'
    messages:
      - $ref: '#/channels/portfolio.position.opened/messages/PositionOpenedMessage'
    bindings:
      kafka:
        groupId:
          type: string
          enum:
            - tracking-service
        bindingVersion: 0.5.0
  receivePositionUpdated:
    action: receive
    channel:
      $ref: '#/channels/portfolio.position.updated'
    messages:
      - $ref: '#/channels/portfolio.position.updated/messages/PositionUpdatedMessage'
    bindings:
      kafka:
        groupId:
          type: string
          enum:
            - tracking-service
        bindingVersion: 0.5.0
  receivePositionClosed:
    action: receive
    channel:
      $ref: '#/channels/portfolio.position.closed'
    messages:
      - $ref: '#/channels/portfolio.position.closed/messages/PositionClosedMessage'
    bindings:
      kafka:
        groupId:
          type: string
          enum:
            - tracking-service
        bindingVersion: 0.5.0
  sendWalletActivityDetected:
    action: send
    channel:
      $ref: '#/channels/tracking.wallet.activity.detected'
    messages:
      - $ref: '#/channels/tracking.wallet.activity.detected/messages/WalletActivityDetectedMessage'
  sendCopyOrderRequested:
    action: send
    channel:
      $ref: '#/channels/tracking.copy.order.requested'
    messages:
      - $ref: '#/channels/tracking.copy.order.requested/messages/CopyOrderRequestedMessage'
  receiveTradeRejected:
    action: receive
    channel:
      $ref: '#/channels/trade.rejected'
    messages:
      - $ref: '#/channels/trade.rejected/messages/TradeRejectedMessage'
    bindings:
      kafka:
        groupId:
          type: string
          enum:
            - tracking-service
        bindingVersion: 0.5.0
components:
  messages:
    PriceTickMessage:
      name: PriceTick
      title: md.price.tick
      contentType: application/json
      correlationId:
        location: $message.payload#/correlationId
      payload:
        $ref: '#/components/schemas/PriceTick'
      bindings:
        kafka:
          key:
            type: string
            description: Значение payload.mint
          bindingVersion: 0.5.0
      examples:
        - name: example1
          payload:
            eventId: 11111111-1111-4111-8111-000000000008
            eventType: md.price.tick
            schemaVersion: 1
            occurredAt: '2026-11-11T12:00:00Z'
            correlationId: 11111111-1111-4111-8111-000000000009
            payload:
              mint: BSBkEGZfkitKTHVaC8VvCJ37Fj5r7XjssBeesic6mjwZ
              priceUsd: 1.234e-05
              observedAt: '2026-11-11T12:00:00Z'
