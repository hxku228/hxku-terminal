asyncapi: 3.0.0
info:
  title: Analyzer Service Kafka API
  version: 1.0.0
  description: Контракт сообщений Kafka для analyzer-service. eventId защищает от повторной обработки; correlationId связывает цепочку событий.
defaultContentType: application/json
servers:
  local:
    host: localhost:9092
    protocol: kafka
    description: Локальный брокер; адрес меняется при развёртывании
channels:
  md.token.discovered:
    address: md.token.discovered
    description: 'Отправитель: market-data-service. Получатели: analyzer-service.'
    servers:
      - $ref: '#/servers/local'
    messages:
      TokenDiscoveredMessage:
        $ref: '#/components/messages/TokenDiscoveredMessage'
  md.liquidity.changed:
    address: md.liquidity.changed
    description: 'Отправитель: market-data-service. Получатели: analyzer-service.'
    servers:
      - $ref: '#/servers/local'
    messages:
      LiquidityChangedMessage:
        $ref: '#/components/messages/LiquidityChangedMessage'
  analysis.rug.detected:
    address: analysis.rug.detected
    description: 'Отправитель: analyzer-service. Получатели: notification-service.'
    servers:
      - $ref: '#/servers/local'
    messages:
      RugDetectedMessage:
        $ref: '#/components/messages/RugDetectedMessage'
operations:
  receiveTokenDiscovered:
    action: receive
    channel:
      $ref: '#/channels/md.token.discovered'
    messages:
      - $ref: '#/channels/md.token.discovered/messages/TokenDiscoveredMessage'
    bindings:
      kafka:
        groupId:
          type: string
          enum:
            - analyzer-service
        bindingVersion: 0.5.0
  receiveLiquidityChanged:
    action: receive
    channel:
      $ref: '#/channels/md.liquidity.changed'
    messages:
      - $ref: '#/channels/md.liquidity.changed/messages/LiquidityChangedMessage'
    bindings:
      kafka:
        groupId:
          type: string
          enum:
            - analyzer-service
        bindingVersion: 0.5.0
  sendRugDetected:
    action: send
    channel:
      $ref: '#/channels/analysis.rug.detected'
    messages:
      - $ref: '#/channels/analysis.rug.detected/messages/RugDetectedMessage'
components:
  messages:
    TokenDiscoveredMessage:
      name: TokenDiscovered
      title: md.token.discovered
      contentType: application/json
      correlationId:
        location: $message.payload#/correlationId
      payload:
        $ref: '#/components/schemas/TokenDiscovered'
      bindings:
        kafka:
          key:
            type: string
            description: Значение payload.mint
          bindingVersion: 0.5.0
      examples:
        - name: example1
          payload:
            eventId: 11111111-1111-4111-8111-000000000008
            eventType: md.token.discovered
            schemaVersion: 1
            occurredAt: '2026-11-11T12:00:00Z'
            correlationId: 11111111-1111-4111-8111-000000000009
            payload:
              mint: BSBkEGZfkitKTHVaC8VvCJ37Fj5r7XjssBeesic6mjwZ
              poolAddress: 8P5BGPTwLDJC55Tua37C7yQiVM6WVXJw3LDetTjeAaxa
              discoveredAt: '2026-11-11T12:00:00Z'
    LiquidityChangedMessage:
      name: LiquidityChanged
      title: md.liquidity.changed
      contentType: application/json
      correlationId:
        location: $message.payload#/correlationId
      payload:
        $ref: '#/components/schemas/LiquidityChanged'
      bindings:
        kafka:
          key:
            type: string
            description: Значение payload.mint
          bindingVersion: 0.5.0
      examples:
        - name: example1
          payload:
            eventId: 11111111-1111-4111-8111-000000000008
            eventType: md.liquidity.changed
            schemaVersion: 1
            occurredAt: '2026-11-11T12:00:00Z'
            correlationId: 11111111-1111-4111-8111-000000000009
            payload:
              mint: BSBkEGZfkitKTHVaC8VvCJ37Fj5r7XjssBeesic6mjwZ
              poolAddress: 8P5BGPTwLDJC55Tua37C7yQiVM6WVXJw3LDetTjeAaxa
              liquidityUsd: 30000
              observedAt: '2026-11-11T12:00:00Z'
    RugDetectedMessage:
      name: RugDetected
      title: analysis.rug.detected
      contentType: application/json
      correlationId:
        location: $message.payload#/correlationId
      payload:
        $ref: '#/components/schemas/RugDetected'
      bindings:
        kafka:
          key:
            type: string
            description: Значение payload.mint
          bindingVersion: 0.5.0
      examples:
        - name: example1
          payload:
            eventId: 11111111-1111-4111-8111-000000000008
            eventType: analysis.rug.detected
            schemaVersion: 1
            occurredAt: '2026-11-11T12:00:00Z'
            correlationId: 11111111-1111-4111-8111-000000000009
            payload:
              mint: BSBkEGZfkitKTHVaC8VvCJ37Fj5r7XjssBeesic6mjwZ
              riskScore: 85
              riskFlags:
                - FREEZE_AUTHORITY_ENABLED
  schemas:
    TokenDiscovered:
      type: object
      required:
        - eventId
        - eventType
        - schemaVersion
        - occurredAt
        - correlationId
        - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          const: md.token.discovered
        schemaVersion:
          type: integer
          const: 1
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid
        payload:
          type: object
          required:
            - mint
            - poolAddress
            - discoveredAt
          properties:
            mint:
              type: string
            poolAddress:
              type: string
            discoveredAt:
              type: string
              format: date-time
    LiquidityChanged:
      type: object
      required:
        - eventId
        - eventType
        - schemaVersion
        - occurredAt
        - correlationId
        - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          const: md.liquidity.changed
        schemaVersion:
          type: integer
          const: 1
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid
        payload:
          type: object
          required:
            - mint
            - poolAddress
            - liquidityUsd
            - observedAt
          properties:
            mint:
              type: string
            poolAddress:
              type: string
            liquidityUsd:
              type:
                - number
                - 'null'
              minimum: 0
            observedAt:
              type: string
              format: date-time
    RugDetected:
      type: object
      required:
        - eventId
        - eventType
        - schemaVersion
        - occurredAt
        - correlationId
        - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          const: analysis.rug.detected
        schemaVersion:
          type: integer
          const: 1
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid
        payload:
          type: object
          required:
            - mint
            - riskScore
            - riskFlags
          properties:
            mint:
              type: string
            riskScore:
              type: number
              minimum: 0
              maximum: 100
            riskFlags:
              type: array
              items:
                type: string
