asyncapi: 3.0.0
info:
  title: Portfolio Service Kafka API
  version: 1.0.0
  description: Контракт сообщений Kafka для portfolio-service. eventId защищает от повторной обработки; correlationId связывает цепочку событий.
defaultContentType: application/json
servers:
  local:
    host: localhost:9092
    protocol: kafka
    description: Локальный брокер; адрес меняется при развёртывании
channels:
  md.price.tick:
    address: md.price.tick
    description: 'Отправитель: market-data-service. Получатели: tracking-service, portfolio-service. Использовать observedAt для защиты от устаревших
      цен.'
    servers:
      - $ref: '#/servers/local'
    messages:
      PriceTickMessage:
        $ref: '#/components/messages/PriceTickMessage'
  trade.executed:
    address: trade.executed
    description: 'Отправитель: trading-service. Получатели: tracking-service, portfolio-service, notification-service. Учитывать сделку один раз
      по orderId; eventId защищает от повторной доставки. Публиковать сделки кошелька и токена в порядке исполнения.'
    servers:
      - $ref: '#/servers/local'
    messages:
      TradeExecutedMessage:
        $ref: '#/components/messages/TradeExecutedMessage'
  trade.failed:
    address: trade.failed
    description: 'Отправитель: trading-service. Получатели: tracking-service, portfolio-service, notification-service. Учитывать фактические расходы
      один раз по orderId и signature; нулевая комиссия не создаёт расход.'
    servers:
      - $ref: '#/servers/local'
    messages:
      TradeFailedMessage:
        $ref: '#/components/messages/TradeFailedMessage'
  portfolio.position.opened:
    address: portfolio.position.opened
    description: 'Отправитель: portfolio-service. Получатели: tracking-service. Публикуется через outbox в одной транзакции с созданием позиции.'
    servers:
      - $ref: '#/servers/local'
    messages:
      PositionOpenedMessage:
        $ref: '#/components/messages/PositionOpenedMessage'
  portfolio.position.updated:
    address: portfolio.position.updated
    description: 'Отправитель: portfolio-service. Получатели: tracking-service. Публикуется через outbox после изменения количества; версия позиции
      увеличивается.'
    servers:
      - $ref: '#/servers/local'
    messages:
      PositionUpdatedMessage:
        $ref: '#/components/messages/PositionUpdatedMessage'
  portfolio.position.closed:
    address: portfolio.position.closed
    description: 'Отправитель: portfolio-service. Получатели: tracking-service. Публикуется через outbox при полном закрытии; версия позиции увеличивается.'
    servers:
      - $ref: '#/servers/local'
    messages:
      PositionClosedMessage:
        $ref: '#/components/messages/PositionClosedMessage'
operations:
  receivePriceTick:
    action: receive
    channel:
      $ref: '#/channels/md.price.tick'
    messages:
      - $ref: '#/channels/md.price.tick/messages/PriceTickMessage'
    bindings:
      kafka:
        groupId:
          type: string
          enum:
            - portfolio-service
        bindingVersion: 0.5.0
  receiveTradeExecuted:
    action: receive
    channel:
      $ref: '#/channels/trade.executed'
    messages:
      - $ref: '#/channels/trade.executed/messages/TradeExecutedMessage'
    bindings:
      kafka:
        groupId:
          type: string
          enum:
            - portfolio-service
        bindingVersion: 0.5.0
  receiveTradeFailed:
    action: receive
    channel:
      $ref: '#/channels/trade.failed'
    messages:
      - $ref: '#/channels/trade.failed/messages/TradeFailedMessage'
    bindings:
      kafka:
        groupId:
          type: string
          enum:
            - portfolio-service
        bindingVersion: 0.5.0
  sendPositionOpened:
    action: send
    channel:
      $ref: '#/channels/portfolio.position.opened'
    messages:
      - $ref: '#/channels/portfolio.position.opened/messages/PositionOpenedMessage'
  sendPositionUpdated:
    action: send
    channel:
      $ref: '#/channels/portfolio.position.updated'
    messages:
      - $ref: '#/channels/portfolio.position.updated/messages/PositionUpdatedMessage'
  sendPositionClosed:
    action: send
    channel:
      $ref: '#/channels/portfolio.position.closed'
    messages:
      - $ref: '#/channels/portfolio.position.closed/messages/PositionClosedMessage'
components:
  messages:
    PriceTickMessage:
      name: PriceTick
      title: md.price.tick
      contentType: application/json
      correlationId:
        location: $message.payload#/correlationId
      payload:
        $ref: '#/components/schemas/PriceTick'
      bindings:
        kafka:
          key:
            type: string
            description: Значение payload.mint
          bindingVersion: 0.5.0
      examples:
        - name: example1
          payload:
            eventId: 11111111-1111-4111-8111-000000000008
            eventType: md.price.tick
            schemaVersion: 1
            occurredAt: '2026-11-11T12:00:00Z'
            correlationId: 11111111-1111-4111-8111-000000000009
            payload:
              mint: BSBkEGZfkitKTHVaC8VvCJ37Fj5r7XjssBeesic6mjwZ
              priceUsd: 1.234e-05
              observedAt: '2026-11-11T12:00:00Z'
    TradeExecutedMessage:
      name: TradeExecuted
      title: trade.executed
      contentType: application/json
      correlationId:
        location: $message.payload#/correlationId
      payload:
        $ref: '#/components/schemas/TradeExecuted'
      bindings:
        kafka:
          key:
            type: string
            description: Строка payload.tradingWalletId + ":" + payload.mint
          bindingVersion: 0.5.0
      examples:
        - name: example1
          payload:
            eventId: 11111111-1111-4111-8111-000000000008
            eventType: trade.executed
            schemaVersion: 1
            occurredAt: '2026-11-11T12:00:00Z'
            correlationId: 11111111-1111-4111-8111-000000000009
            payload:
              intentId: 11111111-1111-4111-8111-000000000007
              orderId: 11111111-1111-4111-8111-000000000020
              userId: 11111111-1111-4111-8111-000000000010
              copySettingsId: 11111111-1111-4111-8111-000000000003
              tradingWalletId: 11111111-1111-4111-8111-000000000002
              mint: BSBkEGZfkitKTHVaC8VvCJ37Fj5r7XjssBeesic6mjwZ
              side: BUY
              positionId: null
              quantityRaw: '100000000'
              tokenDecimals: 6
              amountSol: 0.1
              executionPriceUsd: 0.15
              signature: '3333333333333333333333333333333333333333333333333333333333333333333333333333333333333333'
              networkFeeLamports: 105000
              tipLamports: 100000
              solPriceUsd: 150
              executedAt: '2026-11-11T12:00:00Z'
              amountUsd: 15
        - name: example2
          payload:
            eventId: 11111111-1111-4111-8111-000000000028
            eventType: trade.executed
            schemaVersion: 1
            occurredAt: '2026-11-11T12:05:00Z'
            correlationId: 11111111-1111-4111-8111-000000000009
            payload:
              intentId: 11111111-1111-4111-8111-000000000027
              orderId: 11111111-1111-4111-8111-000000000021
              userId: 11111111-1111-4111-8111-000000000010
              copySettingsId: 11111111-1111-4111-8111-000000000003
              tradingWalletId: 11111111-1111-4111-8111-000000000002
              mint: BSBkEGZfkitKTHVaC8VvCJ37Fj5r7XjssBeesic6mjwZ
              side: SELL
              positionId: 11111111-1111-4111-8111-000000000006
              quantityRaw: '50000000'
              tokenDecimals: 6
              amountSol: 0.06
              executionPriceUsd: 0.18
              signature: '3333333333333333333333333333333333333333333333333333333333333333333333333333333333333333'
              networkFeeLamports: 105000
              tipLamports: 100000
              solPriceUsd: 150
              executedAt: '2026-11-11T12:05:00Z'
              amountUsd: 9
    TradeFailedMessage:
      name: TradeFailed
      title: trade.failed
      contentType: application/json
      correlationId:
        location: $message.payload#/correlationId
      payload:
        $ref: '#/components/schemas/TradeFailed'
      bindings:
        kafka:
          key:
            type: string
            description: Строка payload.tradingWalletId + ":" + payload.mint
          bindingVersion: 0.5.0
      examples:
        - name: example1
          payload:
            eventId: 11111111-1111-4111-8111-000000000008
            eventType: trade.failed
            schemaVersion: 1
            occurredAt: '2026-11-11T12:00:00Z'
            correlationId: 11111111-1111-4111-8111-000000000009
            payload:
              intentId: 11111111-1111-4111-8111-000000000007
              orderId: 11111111-1111-4111-8111-000000000020
              userId: 11111111-1111-4111-8111-000000000010
              copySettingsId: 11111111-1111-4111-8111-000000000003
              tradingWalletId: 11111111-1111-4111-8111-000000000002
              mint: BSBkEGZfkitKTHVaC8VvCJ37Fj5r7XjssBeesic6mjwZ
              side: BUY
              positionId: null
              reason: TRANSACTION_CONFIRMED_FAILED
              networkFeeLamports: 105000
              tipLamports: 0
              solPriceUsd: 150
              executedAt: '2026-11-11T12:00:00Z'
              signature: '3333333333333333333333333333333333333333333333333333333333333333333333333333333333333333'
        - name: example2
          payload:
            eventId: 11111111-1111-4111-8111-000000000018
            eventType: trade.failed
            schemaVersion: 1
            occurredAt: '2026-11-11T12:00:00Z'
            correlationId: 11111111-1111-4111-8111-000000000009
            payload:
              intentId: 11111111-1111-4111-8111-000000000007
              orderId: 11111111-1111-4111-8111-000000000020
              userId: 11111111-1111-4111-8111-000000000010
              copySettingsId: 11111111-1111-4111-8111-000000000003
              tradingWalletId: 11111111-1111-4111-8111-000000000002
              mint: BSBkEGZfkitKTHVaC8VvCJ37Fj5r7XjssBeesic6mjwZ
              side: BUY
              positionId: null
              reason: TRANSACTION_EXPIRED
              networkFeeLamports: 0
              tipLamports: 0
              solPriceUsd: null
              executedAt: null
              signature: '3333333333333333333333333333333333333333333333333333333333333333333333333333333333333333'
    PositionOpenedMessage:
      name: PositionOpened
      title: portfolio.position.opened
      contentType: application/json
      correlationId:
        location: $message.payload#/correlationId
      payload:
        $ref: '#/components/schemas/PositionOpened'
      bindings:
        kafka:
          key:
            type: string
            description: Значение payload.positionId
          bindingVersion: 0.5.0
      examples:
        - name: example1
          payload:
            eventId: 11111111-1111-4111-8111-000000000008
            eventType: portfolio.position.opened
            schemaVersion: 1
            occurredAt: '2026-11-11T12:00:00Z'
            correlationId: 11111111-1111-4111-8111-000000000009
            payload:
              positionId: 11111111-1111-4111-8111-000000000006
              userId: 11111111-1111-4111-8111-000000000010
              copySettingsId: 11111111-1111-4111-8111-000000000003
              tradingWalletId: 11111111-1111-4111-8111-000000000002
              mint: BSBkEGZfkitKTHVaC8VvCJ37Fj5r7XjssBeesic6mjwZ
              quantityRaw: '100000000'
              tokenDecimals: 6
              entryPriceUsd: 0.15
              openingIntentId: 11111111-1111-4111-8111-000000000007
              version: 1
              openedAt: '2026-11-11T12:00:00Z'
              closedAt: null
    PositionUpdatedMessage:
      name: PositionUpdated
      title: portfolio.position.updated
      contentType: application/json
      correlationId:
        location: $message.payload#/correlationId
      payload:
        $ref: '#/components/schemas/PositionUpdated'
      bindings:
        kafka:
          key:
            type: string
            description: Значение payload.positionId
          bindingVersion: 0.5.0
      examples:
        - name: example1
          payload:
            eventId: 11111111-1111-4111-8111-000000000008
            eventType: portfolio.position.updated
            schemaVersion: 1
            occurredAt: '2026-11-11T12:05:00Z'
            correlationId: 11111111-1111-4111-8111-000000000009
            payload:
              positionId: 11111111-1111-4111-8111-000000000006
              userId: 11111111-1111-4111-8111-000000000010
              copySettingsId: 11111111-1111-4111-8111-000000000003
              tradingWalletId: 11111111-1111-4111-8111-000000000002
              mint: BSBkEGZfkitKTHVaC8VvCJ37Fj5r7XjssBeesic6mjwZ
              quantityRaw: '50000000'
              tokenDecimals: 6
              entryPriceUsd: 0.15
              openingIntentId: 11111111-1111-4111-8111-000000000007
              version: 2
              openedAt: '2026-11-11T12:00:00Z'
              closedAt: null
    PositionClosedMessage:
      name: PositionClosed
      title: portfolio.position.closed
      contentType: application/json
      correlationId:
        location: $message.payload#/correlationId
      payload:
        $ref: '#/components/schemas/PositionClosed'
      bindings:
        kafka:
          key:
            type: string
            description: Значение payload.positionId
          bindingVersion: 0.5.0
      examples:
        - name: example1
          payload:
            eventId: 11111111-1111-4111-8111-000000000008
            eventType: portfolio.position.closed
            schemaVersion: 1
            occurredAt: '2026-11-11T12:10:00Z'
            correlationId: 11111111-1111-4111-8111-000000000009
            payload:
              positionId: 11111111-1111-4111-8111-000000000006
              userId: 11111111-1111-4111-8111-000000000010
              copySettingsId: 11111111-1111-4111-8111-000000000003
              tradingWalletId: 11111111-1111-4111-8111-000000000002
              mint: BSBkEGZfkitKTHVaC8VvCJ37Fj5r7XjssBeesic6mjwZ
              quantityRaw: '0'
              tokenDecimals: 6
              entryPriceUsd: 0.15
              openingIntentId: 11111111-1111-4111-8111-000000000007
              version: 3
              openedAt: '2026-11-11T12:00:00Z'
              closedAt: '2026-11-11T12:10:00Z'
  schemas:
    PriceTick:
      type: object
      required:
        - eventId
        - eventType
        - schemaVersion
        - occurredAt
        - correlationId
        - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          const: md.price.tick
        schemaVersion:
          type: integer
          const: 1
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid
        payload:
          type: object
          required:
            - mint
            - priceUsd
            - observedAt
          properties:
            mint:
              type: string
            priceUsd:
              type: number
              exclusiveMinimum: 0
              description: Цена токена в USD
            observedAt:
              type: string
              format: date-time
    TradeExecuted:
      type: object
      required:
        - eventId
        - eventType
        - schemaVersion
        - occurredAt
        - correlationId
        - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          const: trade.executed
        schemaVersion:
          type: integer
          const: 1
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid
        payload:
          type: object
          required:
            - intentId
            - orderId
            - userId
            - copySettingsId
            - tradingWalletId
            - mint
            - side
            - positionId
            - quantityRaw
            - tokenDecimals
            - amountSol
            - executionPriceUsd
            - signature
            - networkFeeLamports
            - tipLamports
            - solPriceUsd
            - executedAt
            - amountUsd
          properties:
            intentId:
              type: string
              format: uuid
            orderId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            copySettingsId:
              type:
                - string
                - 'null'
              format: uuid
              description: null для ручных сделок; tracking обрабатывает только свои автосделки
            tradingWalletId:
              type: string
              format: uuid
            mint:
              type: string
            side:
              type: string
              enum:
                - BUY
                - SELL
            positionId:
              type:
                - string
                - 'null'
              format: uuid
              description: Для ручной сделки или первой покупки может быть null; portfolio определяет позицию по кошельку и mint. Автопродажа
                передаёт positionId.
            quantityRaw:
              type: string
              pattern: ^[1-9][0-9]*$
              description: Фактическое количество полученных при BUY или отданных при SELL токенов в минимальных единицах
            tokenDecimals:
              type: integer
              minimum: 0
              maximum: 255
            amountSol:
              type: number
              minimum: 0
              description: Фактическая сумма SOL, отданная за токены при BUY или полученная при SELL; без сетевой комиссии, tip и затрат на создание
                аккаунтов
            executionPriceUsd:
              type:
                - number
                - 'null'
              exclusiveMinimum: 0
              description: Фактическая цена токена в USD на момент исполнения; null при неизвестной оценке
            signature:
              type: string
            networkFeeLamports:
              type: integer
              minimum: 0
              description: Фактически списанная сетевая комиссия, включая priority fee; 0, если списания не было
            tipLamports:
              type: integer
              minimum: 0
              description: Фактически выплаченный tip, отдельно от networkFeeLamports; 0, если не выплачен
            solPriceUsd:
              type:
                - number
                - 'null'
              format: double
              minimum: 0
              description: Цена SOL в USD на момент исполнения для оценки объёма и комиссий; null, если неизвестна
            executedAt:
              type: string
              format: date-time
              description: Время исполнения транзакции в блокчейне
            amountUsd:
              type:
                - number
                - 'null'
              format: double
              minimum: 0
              description: Фактический объём обмена в USD без сетевой комиссии и tip; null при неизвестной оценке
          allOf:
            - if:
                properties:
                  side:
                    const: SELL
                  copySettingsId:
                    type: string
                required:
                  - side
                  - copySettingsId
              then:
                additionalProperties: true
                properties:
                  positionId:
                    type: string
                    format: uuid
      description: Окончательно исполненная сделка. Portfolio учитывает её один раз по orderId, создаёт или изменяет позицию и сохраняет фактические
        комиссии.
    TradeFailed:
      type: object
      required:
        - eventId
        - eventType
        - schemaVersion
        - occurredAt
        - correlationId
        - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          const: trade.failed
        schemaVersion:
          type: integer
          const: 1
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid
        payload:
          type: object
          required:
            - intentId
            - orderId
            - userId
            - copySettingsId
            - tradingWalletId
            - mint
            - side
            - positionId
            - reason
            - networkFeeLamports
            - tipLamports
            - solPriceUsd
            - executedAt
            - signature
          properties:
            intentId:
              type: string
              format: uuid
            orderId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            copySettingsId:
              type:
                - string
                - 'null'
              format: uuid
              description: null для ручных сделок; tracking обрабатывает только свои автосделки
            tradingWalletId:
              type: string
              format: uuid
            mint:
              type: string
            side:
              type: string
              enum:
                - BUY
                - SELL
            positionId:
              type:
                - string
                - 'null'
              format: uuid
              description: Для ручной сделки или первой покупки может быть null; portfolio определяет позицию по кошельку и mint. Автопродажа
                передаёт positionId.
            reason:
              type: string
              description: Причина окончательного отказа; неизвестный результат остаётся PENDING и сюда не попадает
            networkFeeLamports:
              type: integer
              minimum: 0
              description: Фактически списанная сетевая комиссия, включая priority fee; 0, если списания не было
            tipLamports:
              type: integer
              minimum: 0
              description: Фактически выплаченный tip, отдельно от networkFeeLamports; 0, если не выплачен
            solPriceUsd:
              type:
                - number
                - 'null'
              format: double
              minimum: 0
              description: Цена SOL в USD на момент исполнения для оценки объёма и комиссий; null, если неизвестна
            executedAt:
              type:
                - string
                - 'null'
              format: date-time
              description: Время исполнения транзакции в блокчейне; null, если транзакция не была включена
            signature:
              type:
                - string
                - 'null'
              description: Подпись транзакции; null, если транзакция не была подписана
          allOf:
            - if:
                properties:
                  side:
                    const: SELL
                  copySettingsId:
                    type: string
                required:
                  - side
                  - copySettingsId
              then:
                additionalProperties: true
                properties:
                  positionId:
                    type: string
                    format: uuid
      description: Окончательный отказ, не таймаут RPC. Portfolio учитывает фактически списанные комиссии как расход кошелька; не создаёт исполненную
        сделку или новую позицию.
    PositionOpened:
      type: object
      required:
        - eventId
        - eventType
        - schemaVersion
        - occurredAt
        - correlationId
        - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          const: portfolio.position.opened
        schemaVersion:
          type: integer
          const: 1
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid
        payload:
          type: object
          required:
            - positionId
            - userId
            - copySettingsId
            - tradingWalletId
            - mint
            - quantityRaw
            - tokenDecimals
            - entryPriceUsd
            - openingIntentId
            - version
            - openedAt
            - closedAt
          properties:
            positionId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            copySettingsId:
              type:
                - string
                - 'null'
              format: uuid
              description: null для ручных сделок; tracking обрабатывает только свои автосделки
            tradingWalletId:
              type: string
              format: uuid
            mint:
              type: string
            quantityRaw:
              type: string
              pattern: ^[1-9][0-9]*$
            tokenDecimals:
              type: integer
              minimum: 0
              maximum: 255
            entryPriceUsd:
              type:
                - number
                - 'null'
              exclusiveMinimum: 0
              description: Средняя цена входа оставшихся токенов без сетевой комиссии и tip; null при неизвестной оценке
            openingIntentId:
              type: string
              format: uuid
              description: Намерение первой покупки; сохраняется при обновлениях позиции
            version:
              type: integer
              minimum: 1
